name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint-y-tipos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar paquete con extras
        run: pip install -e ".[dev,pdf]"
      - name: Ruff (lint)
        run: ruff check .
      - name: Mypy (tipos)
        run: mypy

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Instalar paquete con extras
        run: pip install -e ".[dev,pdf]"
      - name: Pytest
        run: pytest
